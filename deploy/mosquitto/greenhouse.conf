# Mosquitto settings for the greenhouse (docs/RUNBOOK.md, step 2).
# Copy to /etc/mosquitto/conf.d/greenhouse.conf and restart mosquitto.

# Plain MQTT on the LAN. Every client must log in; nobody connects anonymously.
listener 1883
allow_anonymous false

# Created with: sudo mosquitto_passwd -c /etc/mosquitto/greenhouse.passwd greenhouse-server
#               sudo mosquitto_passwd    /etc/mosquitto/greenhouse.passwd greenhouse-device-1
password_file /etc/mosquitto/greenhouse.passwd

# Who may publish/subscribe to what (copy greenhouse.acl there too).
acl_file /etc/mosquitto/greenhouse.acl

# Keep retained relay states and device status across broker restarts.
persistence true
